name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: go test -v ./...

      - name: Run benchmarks
        run: |
          echo "Running Go benchmarks..."
          go test -bench=. -benchmem -run=^$ ./tests/ 2>/dev/null | tee /tmp/bench_raw.txt

      - name: Generate benchmark outputs
        run: |
          VERSION=${{ github.ref_name }}
          
          # Generate JSON for dashboard
          chmod +x scripts/run_benchmarks.sh
          ./scripts/run_benchmarks.sh benchmark_results.json cached
          
          # Generate benchmarks.md (summary)
          echo "# CommitDB Benchmarks - ${VERSION}" > benchmarks.md
          echo "" >> benchmarks.md
          echo "Generated: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> benchmarks.md
          echo "" >> benchmarks.md
          echo "## Go Micro-benchmarks" >> benchmarks.md
          echo '```' >> benchmarks.md
          cat /tmp/bench_raw.txt >> benchmarks.md
          echo '```' >> benchmarks.md

      - name: Set up Python for MkDocs
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install MkDocs
        run: pip install mkdocs-material

      - name: Build documentation
        run: mkdocs build --site-dir _site

      - name: Add generated reports to site
        run: |
          # Copy benchmark reports
          cp benchmarks.md _site/benchmarks.md
          # Copy JSON for PR benchmark comparison
          mkdir -p _site/benchmarks
          cp benchmark_results.json _site/benchmarks/latest.json

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Build binaries
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          LDFLAGS="-X main.Version=${VERSION}"
          
          # CLI binaries
          GOOS=linux GOARCH=amd64 go build -ldflags "$LDFLAGS" -o dist/commitdb-linux-amd64 ./cmd/commitdb
          GOOS=linux GOARCH=arm64 go build -ldflags "$LDFLAGS" -o dist/commitdb-linux-arm64 ./cmd/commitdb
          GOOS=darwin GOARCH=amd64 go build -ldflags "$LDFLAGS" -o dist/commitdb-darwin-amd64 ./cmd/commitdb
          GOOS=darwin GOARCH=arm64 go build -ldflags "$LDFLAGS" -o dist/commitdb-darwin-arm64 ./cmd/commitdb
          GOOS=windows GOARCH=amd64 go build -ldflags "$LDFLAGS" -o dist/commitdb-windows-amd64.exe ./cmd/commitdb

      - name: Extract release notes
        run: |
          # Extract notes for the current version from CHANGELOG.md
          VERSION=${GITHUB_REF_NAME#v}
          awk "/^## \[${VERSION}\]/{flag=1; next} /^## \[/{flag=0} flag" CHANGELOG.md > release_notes.txt

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --notes-file release_notes.txt \
            benchmarks.md \
            dist/commitdb-linux-amd64 \
            dist/commitdb-linux-arm64 \
            dist/commitdb-darwin-amd64 \
            dist/commitdb-darwin-arm64 \
            dist/commitdb-windows-amd64.exe

  deploy-pages:
    name: Deploy Docs
    runs-on: ubuntu-latest
    needs: release
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
