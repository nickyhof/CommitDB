[package]
name = "commitdb"
version = "0.1.0"
edition = "2021"
description = "Rust client for CommitDB SQL Server"
license = "Apache-2.0"
repository = "https://github.com/nickyhof/CommitDB"
keywords = ["database", "sql", "git", "commitdb"]
categories = ["database"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
native-tls = "0.2"
thiserror = "2"

[features]
integration = []
